plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

project.ext.lwjglVersion = "3.4.1"
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/pupper.classtweaker")
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.lenni0451.net/everything" }
    maven { url "https://repo.viaversion.com/" }
    maven { url "https://repo.opencollab.dev/maven-snapshots/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.florianreuth.de/snapshots" }
}

configurations {
    modJij
    include.extendsFrom modJij
    implementation.extendsFrom modJij
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation  "com.viaversion:viafabricplus-api:4.5.1"
    runtimeOnly "maven.modrinth:sodium:mc26.1.1-0.8.9-fabric"
    runtimeOnly "maven.modrinth:iris:1.10.9+26.1-fabric"
    // runtimeOnly "maven.modrinth:sodium-extra:mc26.1.1-0.8.6-fabric"
    runtimeOnly "maven.modrinth:lithium:mc26.1.1-0.23.0-fabric"
    // modImplementation "maven.modrinth:in-game-account-switcher:WBbjirJP"
    implementation "com.viaversion:viafabricplus:4.5.1"
    runtimeOnly "maven.modrinth:immediatelyfast:1.15.1+26.1.1-fabric"
    runtimeOnly "maven.modrinth:entityculling:YSbzFHRt"
    implementation "maven.modrinth:modmenu:18.0.0-alpha.8"

    modJij 'io.github.smartboot.socket:aio-core:1.7.1'
    modJij 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    modJij 'io.github.humbleui:types:0.2.0'
    modJij 'io.github.humbleui:skija-windows-x64:0.143.12'

    modJij 'com.kohlschutter.junixsocket:junixsocket-common:2.10.1'
    modJij 'org.java-websocket:Java-WebSocket:1.6.0'
    modJij 'com.mpatric:mp3agic:0.9.1'
    modJij 'javazoom:jlayer:1.0.1'
    modJij 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    modJij 'org:jaudiotagger:2.0.3'
    modJij 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    modJij "net.lenni0451:MCPing:1.4.2"
    modJij "net.lenni0451:Reflect:1.4.0"
    implementation 'net.java.dev.jna:jna:5.12.1'
    implementation 'net.java.dev.jna:jna-platform:5.12.1'

    def lwjglNfdDeps = [
            "org.lwjgl:lwjgl-nfd:$lwjglVersion",
            "org.lwjgl:lwjgl-nfd::natives-linux",
            "org.lwjgl:lwjgl-nfd::natives-macos",
            "org.lwjgl:lwjgl-nfd::natives-macos-arm64",
            "org.lwjgl:lwjgl-nfd::natives-windows"
    ]

    lwjglNfdDeps.each { dep ->
        modJij dep
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    doLast {
        def resourcePath = sourceSets.main.resources.srcDirs[0]
        def iconFile = new File(resourcePath, "assets/pupper/logo.png")
        if (!iconFile.exists()) {
            throw new GradleException("Pupper icon not found: ${iconFile.absolutePath}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
