plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

project.ext.lwjglVersion = "3.3.3"
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/pupper.accesswidener")
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.lenni0451.net/everything" }
    maven { url "https://repo.viaversion.com/" }
    maven { url "https://repo.opencollab.dev/maven-snapshots/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.florianreuth.de/snapshots" }
}

configurations {
    jij
    modJij
    include.extendsFrom modJij
    modImplementation.extendsFrom modJij
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "com.viaversion:viafabricplus-api:4.5.1"
    modRuntimeOnly "maven.modrinth:sodium:mc26.1.1-0.8.9-fabric"
    modRuntimeOnly "maven.modrinth:iris:1.10.9+26.1-fabric"
    modRuntimeOnly "maven.modrinth:sodium-extra:mc26.1.1-0.8.6-fabric"
    modRuntimeOnly "maven.modrinth:lithium:mc26.1.1-0.23.0-fabric"
    // modImplementation "maven.modrinth:in-game-account-switcher:WBbjirJP"
    modImplementation "com.viaversion:viafabricplus:4.5.1"
    modRuntimeOnly "maven.modrinth:immediatelyfast:1.15.1+26.1.1-fabric"
    modRuntimeOnly "maven.modrinth:entityculling:YSbzFHRt"
    modImplementation "maven.modrinth:modmenu:18.0.0-alpha.8"

    jij 'io.github.smartboot.socket:aio-core:1.7.1'
    jij 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    jij 'io.github.humbleui:types:0.2.0'
    jij 'io.github.humbleui:skija-windows-x64:0.143.2'
    jij 'io.github.humbleui:skija-linux-x64:0.143.2'
    jij 'io.github.humbleui:skija-linux-arm64:0.143.2'
    jij 'io.github.humbleui:skija-macos-x64:0.143.2'
    jij 'com.kohlschutter.junixsocket:junixsocket-common:2.10.1'
    jij 'org.java-websocket:Java-WebSocket:1.6.0'
    jij 'com.mpatric:mp3agic:0.9.1'
    jij 'javazoom:jlayer:1.0.1'
    jij 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    jij 'org:jaudiotagger:2.0.3'
    jij 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    jij "net.lenni0451:MCPing:1.4.2"
    jij "net.lenni0451:Reflect:1.4.0"
    modImplementation 'net.java.dev.jna:jna:5.12.1'
    modImplementation 'net.java.dev.jna:jna-platform:5.12.1'

    def lwjglNfdDeps = [
            "org.lwjgl:lwjgl-nfd:$lwjglVersion",
            "org.lwjgl:lwjgl-nfd::natives-linux",
            "org.lwjgl:lwjgl-nfd::natives-macos",
            "org.lwjgl:lwjgl-nfd::natives-macos-arm64",
            "org.lwjgl:lwjgl-nfd::natives-windows"
    ]

    lwjglNfdDeps.each { dep ->
        jij dep
        implementation dep
        include dep
    }

    afterEvaluate {
        configurations.jij.incoming.resolutionResult.allDependencies.each {
            dependencies.include(dependencies.implementation(dependencies.compileOnlyApi(it.requested.toString()) {
                transitive = false
            }))
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    doLast {
        def resourcePath = sourceSets.main.resources.srcDirs[0]
        def iconFile = new File(resourcePath, "assets/pupper/logo.png")
        if (!iconFile.exists()) {
            throw new GradleException("Pupper icon not found: ${iconFile.absolutePath}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.environmentVariable("CHANGELOG").getOrElse("No changelog provided")
    type = STABLE
    modLoaders.add("fabric")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "zN1WBfNk"

        minecraftVersions.add(project.minecraft_version)

        requires("fabric-api")
        requires("viafabricplus")
        requires("in-game-account-switcher")
        requires("modmenu")

        optional("sodium", "iris")
    }

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "PupperClient/Pupper-Client"
        commitish = "main"
        tagName = project.mod_version
    }
}
